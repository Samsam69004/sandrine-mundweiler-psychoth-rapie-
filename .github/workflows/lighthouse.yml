name: Lighthouse Audit

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v8
        with:
          urls: https://sandrine-mundweiler-psychotherapie.vercel.app
          uploadArtifacts: true
          output: html
